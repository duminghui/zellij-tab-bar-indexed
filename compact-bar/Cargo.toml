[package]
name = "compact-bar"
version = "0.1.0"
authors = [
    "Alexander Kenji Berthold <aks.kenji@protonmail.com>",
    "Ilya Voronin <ivoronin@gmail.com>"
]
edition = "2021"
license = "MIT"
description = "Compact-bar plugin for Zellij with optional tab indices"
repository = "https://github.com/ivoronin/zellij-tab-bar-indexed"

[dependencies]
ansi_term = { version = "0.12.1", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
zellij-tile = "0.45.1"
zellij-tile-utils = "0.45.1"
